// ---- Metadatos incrustados en las imágenes PNG descargadas (chunks iTXt, UTF-8) ----
const PNG_CRC_TABLE = (() => {
  const tbl = [];
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    tbl[n] = c >>> 0;
  }
  return tbl;
})();

function pngCrc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = PNG_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function makeITXt(keyword, text) {
  const enc = new TextEncoder();
  const kw = enc.encode(keyword);
  const tx = enc.encode(text);
  // keyword + 0 + flag compresión (0) + método compresión (0) + idioma vacío + 0 + palabra traducida vacía + 0 + texto UTF-8
  const data = new Uint8Array(kw.length + 5 + tx.length);
  data.set(kw, 0);
  data.set(tx, kw.length + 5);
  const type = enc.encode("iTXt");
  const chunk = new Uint8Array(12 + data.length);
  const dv = new DataView(chunk.buffer);
  dv.setUint32(0, data.length);
  chunk.set(type, 4);
  chunk.set(data, 8);
  const crcInput = new Uint8Array(4 + data.length);
  crcInput.set(type, 0);
  crcInput.set(data, 4);
  dv.setUint32(8 + data.length, pngCrc32(crcInput));
  return chunk;
}

function injectPngChunks(bytes, fields) {
  const sig = [137, 80, 78, 71, 13, 10, 26, 10];
  for (let i = 0; i < 8; i++) if (bytes[i] !== sig[i]) return bytes;
  const chunks = (fields || [])
    .filter(f => f && f[0] && f[1] !== undefined && f[1] !== null && String(f[1]).trim() !== "")
    .map(f => makeITXt(f[0], String(f[1])));
  if (!chunks.length) return bytes;
  const insertAt = 33; // firma PNG (8) + chunk IHDR (25)
  const total = chunks.reduce((a, c) => a + c.length, 0);
  const out = new Uint8Array(bytes.length + total);
  out.set(bytes.subarray(0, insertAt), 0);
  let off = insertAt;
  chunks.forEach(c => { out.set(c, off); off += c.length; });
  out.set(bytes.subarray(insertAt), off);
  return out;
}

function readBlobBuffer(b) {
  if (b.arrayBuffer) return b.arrayBuffer();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsArrayBuffer(b); });
}

async function pngWithMetadata(blob, fields) {
  const buf = new Uint8Array(await readBlobBuffer(blob));
  return new Blob([injectPngChunks(buf, fields)], { type: "image/png" });
}

// Cada vez que se guarda un PNG desde un canvas y hay metadatos listos (window.__gramitoMeta), se incrustan.
(function installPngMetadata() {
  if (typeof HTMLCanvasElement === "undefined" || HTMLCanvasElement.prototype.__gramitoPatched) return;
  const origToBlob = HTMLCanvasElement.prototype.toBlob;
  HTMLCanvasElement.prototype.toBlob = function (cb, type, q) {
    const meta = window.__gramitoMeta;
    if (!meta || (type && type !== "image/png")) return origToBlob.call(this, cb, type, q);
    return origToBlob.call(this, blob => {
      if (!blob) { cb(blob); return; }
      pngWithMetadata(blob, meta).then(cb, () => cb(blob));
    }, type, q);
  };
  const origToDataURL = HTMLCanvasElement.prototype.toDataURL;
  HTMLCanvasElement.prototype.toDataURL = function (type, q) {
    const url = origToDataURL.call(this, type, q);
    const meta = window.__gramitoMeta;
    if (!meta || typeof url !== "string" || url.indexOf("data:image/png") !== 0) return url;
    try {
      const bin = atob(url.split(",")[1]);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const out = injectPngChunks(bytes, meta);
      let s = "";
      for (let i = 0; i < out.length; i += 0x8000) s += String.fromCharCode.apply(null, out.subarray(i, i + 0x8000));
      return "data:image/png;base64," + btoa(s);
    } catch (e) { return url; }
  };
  HTMLCanvasElement.prototype.__gramitoPatched = true;
})();

// Separa el texto de molienda en Moledor (ej. K6) y Molienda (ej. 90 clics, fino, grueso...)
function splitGrind(str) {
  let s = (str || "").trim();
  if (!s) return { moledor: "", molienda: "" };
  const parts = [];
  const clickRe = /(\d+(?:[.,]\d+)?\s*(?:clics?|clicks?)\b|\b(?:clics?|clicks?)\s*\d+(?:[.,]\d+)?|\b(?:clics?|clicks?)\b)/i;
  const wordRe = /\b(extra[\s-]+(?:fin[oa]s?|grues[oa]s?|fine|coarse)|medi[oa]s?[\s-]+(?:fin[oa]s?|grues[oa]s?)|medium[\s-]+(?:fine|coarse)|fin[oa]s?|grues[oa]s?|medi[oa]s?|fine|medium|coarse)\b/i;
  [clickRe, wordRe].forEach(re => {
    const m = s.match(re);
    if (m) {
      parts.push(m[0].trim());
      s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length);
    }
  });
  if (parts.length === 0) {
    const segs = s.split(/\s*[•·|;]\s*/).map(x => x.trim()).filter(Boolean);
    if (segs.length >= 2) return { moledor: segs[0], molienda: segs.slice(1).join(" · ") };
  }
  const moledor = s.replace(/^[\s•·|,;\/\-–—]+/, "").replace(/[\s•·|,;\/\-–—]+$/, "").replace(/\s{2,}/g, " ").trim();
  return { moledor, molienda: parts.join(" · ") };
}

function grindMeta(K, str) {
  const g = splitGrind(str);
  return [[K("Moledor","Grinder"), g.moledor], [K("Molienda","Grind"), g.molienda]];
}

function sentence(str) {
  return (str === str.toUpperCase() && str.length > 3) ? str.charAt(0) + str.slice(1).toLowerCase() : str;
}

function fmtTime(s) {
  const m = Math.floor(Math.max(0,s)/60);
  const sec = Math.floor(Math.max(0,s)%60);
  return `${m}:${sec.toString().padStart(2,"0")}`;
}

function getPhase(phases, t) {
  return phases.find(p => t >= p.start && t < p.end) || phases[phases.length-1];
}

function hexToRgba(hex, alpha) {
  const h = hex.replace("#","");
  const r = parseInt(h.substring(0,2),16);
  const g = parseInt(h.substring(2,4),16);
  const b = parseInt(h.substring(4,6),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function nowLocalDatetimeStr() {
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatSteepDuration(startStr, endStr, lang) {
  if (!startStr || !endStr) return "--";
  const start = new Date(startStr);
  const end = new Date(endStr);
  const diffMs = end - start;
  if (isNaN(diffMs) || diffMs < 0) return "--";
  const totalMin = Math.round(diffMs / 60000);
  const h = Math.floor(totalMin / 60);
  const m = totalMin % 60;
  return lang === "en" ? `${h}h ${m}m` : `${h}h ${m}m`;
}

function formatDatetimeDisplay(str, lang) {
  if (!str) return "--";
  const d = new Date(str);
  if (isNaN(d.getTime())) return "--";
  return d.toLocaleString(lang === "es" ? "es-CO" : "en-US", { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit", hour12:false });
}

  const [mkGrind, setMkGrind]         = useState("");
  const [mkCoffeeG, setMkCoffeeG]     = useState("");
  const [mkWaterML, setMkWaterML]     = useState("");
  const [mkStarted, setMkStarted]     = useState(false);
  const [mkDone, setMkDone]           = useState(false);
  const [mkElapsed, setMkElapsed]     = useState(0);
  const [mkCapturing, setMkCapturing] = useState(false);
  const [mkFinishedAt, setMkFinishedAt] = useState(null);
  const mkStartRef = useRef(0);
  const mkRef = useRef(null);

  useEffect(() => {
    if (!mkStarted || mkDone) return;
    const id = setInterval(() => setMkElapsed((Date.now() - mkStartRef.current) / 1000), 250);
    return () => clearInterval(id);
  }, [mkStarted, mkDone]);

  // ---- Biblioteca: recetas guardadas y diario ----
  const LIB_KEY = "pourlab-library-v1";
  const [library, setLibrary] = useState({ recipes: [], diary: [] });
  const [libReady, setLibReady] = useState(false);
  const [menuTab, setMenuTab] = useState("recipes");
  const [menuBrewer, setMenuBrewer] = useState(null);
  const [diaryOpenId, setDiaryOpenId] = useState(null);
  const [diaryEdit, setDiaryEdit] = useState(false);
  const [diaryDraft, setDiaryDraft] = useState({ name:"", grind:"", note:"" });
  const [diaryConfirm, setDiaryConfirm] = useState(false);
  const [diaryCapturing, setDiaryCapturing] = useState(false);
  const diaryRef = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(LIB_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        setLibrary({ recipes: d.recipes || [], diary: d.diary || [] });
      }
    } catch (e) {}
    setLibReady(true);
  }, []);

  useEffect(() => {
    if (!libReady) return;
    try { localStorage.setItem(LIB_KEY, JSON.stringify(library)); } catch (e) {}
  }, [library, libReady]);

  function addDiaryEntry(entry) {
    // Diario desactivado: ya no se registran entradas.
  }

  // Extracción terminada
  useEffect(() => {
    if (!libReady || !isDone || !recipe) return;
    const total = Math.round(coffeeG * (1000 / recipe.ratioGPerL));
    const ratio = `1:${Math.floor((1000 / recipe.ratioGPerL) * 10 + 1e-9) / 10}`;
    addDiaryEntry({
      key: `ext|${recipeId}|${coffeeG}|${Math.round(totalElapsed * 10)}|${coffeeName}|${grind}`,
      ts: Date.now(), type: "extraction", color: recipe.color,
      title: t(recipe.name.es, recipe.name.en), name: coffeeName, grind, extra: "",
      metrics: [
        { label: t("Café","Coffee"), value: `${coffeeG} g` },
        { label: t("Agua","Water"), value: `${total} ml` },
        { label: t("Tiempo","Time"), value: fmtTime(totalElapsed) },
        { label: "Ratio", value: ratio },
      ],
      rowsTitle: `${t("FASES","PHASES")} · ${t(recipe.shortName.es, recipe.shortName.en)}`,
      rows: [
        ...runPhases.filter(p => p.id !== "drawdown" && p.id !== "free").map(p => ({
          t: fmtTime(phaseTimestamps[p.id] !== undefined ? phaseTimestamps[p.id] : p.start),
          label: p.label, detail: `${p.targetWater} g`,
        })),
        { t: "fin", label: t("Drenado completo","Brew complete"), detail: fmtTime(totalElapsed) },
      ],
      note: "",
    });
  }, [isDone, libReady]);

  // Cafetera italiana terminada
  useEffect(() => {
    if (!libReady || !mkDone || !mkFinishedAt) return;
    const c = parseFloat(mkCoffeeG), w = parseFloat(mkWaterML);
    addDiaryEntry({
      key: `mk|${mkFinishedAt}`,
      ts: mkFinishedAt, type: "moka", color: MOKA_COLOR,
      title: t("Hoffmann · Cafetera italiana","Hoffmann · Moka Pot"), name: mkName, grind: mkGrind, extra: "",
      metrics: [
        ...(c > 0 ? [{ label: t("Café","Coffee"), value: `${mkCoffeeG} g` }] : []),
        ...(w > 0 ? [{ label: t("Agua","Water"), value: `${mkWaterML} ml` }] : []),
        ...((c > 0 && w > 0) ? [{ label: "Ratio", value: `1:${Math.floor((w / c) * 10 + 1e-9) / 10}` }] : []),
        { label: t("Tiempo","Time"), value: fmtTime(mkElapsed) },
      ],
      rowsTitle: "", rows: [], note: "",
    });
  }, [mkDone, libReady]);

  // Ficha de cata creada
  useEffect(() => {
    if (!libReady || !cupDone) return;
    const c = parseFloat(cupCoffeeG), w = parseFloat(cupWaterG);
    addDiaryEntry({
      key: `cup|${cupCoffee}|${cupScore}|${cupComments}|${cupCoffeeG}|${cupWaterG}|${cupMethod}`,
      ts: Date.now(), type: "cupping", color: CUPPING_COLOR,
      title: t("Ficha de cata","Tasting sheet"), name: cupCoffee, grind: cupGrind,
      extra: [cupVariety, cupProcess].filter(Boolean).join(" · "),
      metrics: [
        { label: t("Puntuación","Score"), value: cupScore.toFixed(1) },
        ...(c > 0 ? [{ label: t("Café","Coffee"), value: `${cupCoffeeG} g` }] : []),
        ...(w > 0 ? [{ label: t("Agua","Water"), value: `${cupWaterG} ml` }] : []),
        ...((c > 0 && w > 0) ? [{ label: "Ratio", value: `1:${Math.floor((w / c) * 10 + 1e-9) / 10}` }] : []),
      ],
      rowsTitle: "",
      rows: cupMethod ? [{ t: "", label: t("Método","Method"), detail: cupMethod }] : [],
      note: cupComments,
    });
  }, [cupDone, libReady]);

  // Cold Brew registrado
  useEffect(() => {
    if (!libReady || !cbDone) return;
    const water = Math.round(cbCoffeeG * cbRatio);
    addDiaryEntry({
      key: `cb|${cbStart}|${cbEnd}|${cbCoffeeG}|${cbRatio}|${cbCoffeeName}`,
      ts: Date.now(), type: "coldbrew", color: COLDBREW_COLOR,
      title: "Cold Brew", name: cbCoffeeName, grind: cbGrind, extra: cbAdditions,
      metrics: [
        { label: t("Café","Coffee"), value: `${cbCoffeeG} g` },
        { label: t("Agua","Water"), value: `${water} ml` },
        { label: "Ratio", value: `1:${cbRatio}` },
        { label: t("Reposo","Steep"), value: formatSteepDuration(cbStart, cbEnd, lang) },
      ],
      rowsTitle: "",
      rows: [
        { t: "", label: t("Inicio","Start"), detail: formatDatetimeDisplay(cbStart, lang) },
        { t: "", label: t("Fin","End"), detail: formatDatetimeDisplay(cbEnd, lang) },
      ],
      note: "",
    });
  }, [cbDone, libReady]);

  // ---- Pedidos / comandas ----
  const ORD_KEY = "pourlab-orders-v1";
  const [orders, setOrders] = useState([]);
  const [ordReady, setOrdReady] = useState(false);
  const [ordView, setOrdView] = useState("list");
  const [ordOpenId, setOrdOpenId] = useState(null);
  const [ordName, setOrdName] = useState("");
  const [ordRows, setOrdRows] = useState([]);
  const [ordConfirm, setOrdConfirm] = useState(false);
  const [ordCapturing, setOrdCapturing] = useState(false);
  const [ordCopied, setOrdCopied] = useState(false);
  const ordRef = useRef(null);

  useEffect(() => {
    try {
      const raw = localStorage.getItem(ORD_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        if (Array.isArray(d)) setOrders(d);
      }
    } catch (e) {}
    setOrdReady(true);
  }, []);

  useEffect(() => {
    if (!ordReady) return;
    try { localStorage.setItem(ORD_KEY, JSON.stringify(orders)); } catch (e) {}
  }, [orders, ordReady]);

  function ordOptionLabel(rid) {
    if (rid === "americano") return "Americano";
    if (rid === "espresso") return "Espresso";
    if (rid === "cappuccino") return "Cappuccino";
    if (rid === "coldbrew") return "Cold Brew";
    const cat = CATEGORIES.find(c => c.id === rid);
    if (cat) return sentence(t(cat.label, cat.en));
    const r = RECIPES[rid];
    return r ? t(r.name.es, r.name.en) : rid;
  }

  function ordColor(rid) {
    if (rid === "americano") return "#623520";
    if (rid === "espresso") return "#3B1A0A";
    if (rid === "cappuccino") return "#C68B4E";
    if (rid === "coldbrew") return COLDBREW_COLOR;
    if (rid === "moka") return MOKA_COLOR;
    const cat = CATEGORIES.find(c => c.id === rid);
    if (cat && cat.recipes[0] && RECIPES[cat.recipes[0]]) return RECIPES[cat.recipes[0]].color;
    return RECIPES[rid] ? RECIPES[rid].color : "#8B5A35";
  }

  function canPrepare(rid) {
    return ["moka","coldbrew","v60","prensa","aeropress","cloth","melitta","chemex"].includes(rid) || !!RECIPES[rid];
  }

  function newOrder() {
    setOrdName("");
    setOrdRows([]);
    setOrdView("new");
  }

  function updateOrdRow(i, patch) {
    setOrdRows(prev => prev.map((r, idx) => idx === i ? { ...r, ...patch } : r));
  }

  function addOrdRow() {
    setOrdRows(prev => [...prev, { rid: prev.length ? prev[prev.length - 1].rid : "americano", cups:1, note:"" }]);
  }

  function addOrdItem(rid) {
    setOrdRows(prev => {
      const i = prev.findIndex(r => r.rid === rid && !r.note);
      if (i >= 0) return prev.map((r, idx) => idx === i ? { ...r, cups: r.cups + 1 } : r);
      return [...prev, { rid, cups:1, note:"" }];
    });
  }

  function removeOrdRow(i) {
    setOrdRows(prev => prev.filter((_, idx) => idx !== i));
  }

  function createOrder() {
    const ts = Date.now();
    const items = ordRows.filter(r => r.cups > 0).map((r, i) => ({ id: `${ts}-${i}`, rid: r.rid, cups: r.cups, note: r.note.trim(), done: false }));
    if (items.length === 0) return;
    const num = orders.reduce((m, o) => Math.max(m, o.num || 0), 0) + 1;
    const order = { id: `${ts}`, num, ts, name: ordName.trim(), items };
    setOrders(prev => [order, ...prev].slice(0, 100));
    setOrdOpenId(order.id);
    setOrdConfirm(false);
    setOrdView("detail");
  }

  function toggleItemDone(oid, iid) {
    setOrders(prev => prev.map(o => o.id === oid ? { ...o, items: o.items.map(it => it.id === iid ? { ...it, done: !it.done } : it) } : o));
  }

  function deleteOrder(oid) {
    setOrders(prev => prev.filter(o => o.id !== oid));
    setOrdOpenId(null);
    setOrdConfirm(false);
    setOrdView("list");
  }

  function prepareItem(it) {
    if (it.rid === "moka") { openMoka(); return; }
    if (it.rid === "coldbrew") { openColdBrew(); setCbCoffeeG(30 * it.cups); return; }
    const recipeKey = { v60:"ultimate", prensa:"frenchpress4min", cloth:"clothfilter" }[it.rid] || it.rid;
    const r = RECIPES[recipeKey];
    if (!r) return;
    openRecipe(recipeKey);
    const c = r.defaultCoffee * it.cups;
    setCoffeeG(c);
    setInputVal(String(c));
    setRunPhases(r.phases(c, r.ratioGPerL, lang));
  }

  function orderText(o) {
    const d = new Date(o.ts);
    const loc = lang === "es" ? "es-CO" : "en-US";
    const when = `${d.toLocaleDateString(loc, { day:"2-digit", month:"short", year:"numeric" })} · ${d.toLocaleTimeString(loc, { hour:"2-digit", minute:"2-digit", hour12:false })}`;
    const head = `${t("COMANDA","ORDER")} #${String(o.num).padStart(3, "0")}${o.name ? " · " + o.name : ""}`;
    const lines = o.items.map(it => `• ${it.cups} × ${ordOptionLabel(it.rid)}${it.note ? ` (${it.note})` : ""}`);
    return [head, when, "", ...lines].join("\n");
  }

  function copyOrderText(o) {
    const txt = orderText(o);
    const ok = () => { setOrdCopied(true); setTimeout(() => setOrdCopied(false), 1800); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(ok).catch(() => {});
    } catch (e) {}
  }

  function orderIcon(rid, size) {
    const key = METHOD_ICON[rid] || rid;
    if (["v60","prensa","aeropress","cloth","melitta","chemex","moka","coldbrew"].includes(key)) {
      return <BrewerIcon id={key} color="#fffdfa" size={size} px={1.6} />;
    }
    return <TabIcon id="recipes" color="#fffdfa" size={size} />;
  }

  // Metadatos para el PNG que se descargaría en la pantalla actual (o null si no aplica)
  function computePngMeta() {
    const pad = n => String(n).padStart(2, "0");
    const dateISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const timeHM = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const K = (es, en) => lang === "en" ? en : es;
    const dt = d => [[K("Fecha","Date"), dateISO(d)], [K("Hora","Time"), timeHM(d)]];
    const ratioOf = (c, w) => (c > 0 && w > 0) ? `1:${Math.floor((w / c) * 10 + 1e-9) / 10}` : "";
    const now = new Date();
    const sc = String(screen).toLowerCase();

    // Comanda
    if (screen === "menu" && menuTab === "orders" && ordView === "detail" && ordOpenId) {
      const o = orders.find(x => x.id === ordOpenId);
      if (!o) return null;
      return [
        [K("Pedido","Order"), String(o.num).padStart(3, "0")],
        [K("Nombre_o_mesa","Name_or_table"), o.name],
        ...dt(new Date(o.ts)),
        [K("Bebidas","Drinks"), o.items.map(it => `${it.cups} × ${ordOptionLabel(it.rid)}${it.note ? ` (${it.note})` : ""}`).join("\n")],
      ];
    }

    // Cafetera italiana
    if (screen === "moka" && mkDone && mkFinishedAt) {
      const c = parseFloat(mkCoffeeG), w = parseFloat(mkWaterML);
      return [
        ...dt(new Date(mkFinishedAt)),
        [K("Metodo","Method"), ordOptionLabel("moka")],
        [K("Receta","Recipe"), K("Cafetera italiana Hoffmann","Moka Pot Hoffmann")],
        [K("Cafe","Coffee"), mkName],
        ...grindMeta(K, mkGrind),
        [K("Ml_agua","Water_ml"), w > 0 ? String(mkWaterML) : ""],
        [K("Gramos_cafe","Coffee_g"), c > 0 ? String(mkCoffeeG) : ""],
        ["Ratio", ratioOf(c, w)],
        [K("Tiempo_total","Total_time"), fmtTime(mkElapsed)],
      ];
    }

    // Resumen de extracción
    if (screen === "app" && isDone && recipe) {
      const total = Math.round(coffeeG * (1000 / recipe.ratioGPerL));
      const catId = METHOD_ICON[recipeId];
      const methodName = catId ? ordOptionLabel(catId) : ((customBrewer || "").trim() || K("Personalizada","Custom"));
      const names = META_RECIPE_NAMES[recipeId];
      const baseName = recipe.shortName ? t(recipe.shortName.es, recipe.shortName.en) : K("Mi receta","My recipe");
      const brewerTxt = (customBrewer || "").trim();
      const recipeName = names ? K(names[0], names[1]) : (brewerTxt ? `${baseName} · ${brewerTxt}` : baseName);
      return [
        ...dt(now),
        [K("Metodo","Method"), methodName],
        [K("Receta","Recipe"), recipeName],
        [K("Cafe","Coffee"), coffeeName],
        ...grindMeta(K, grind),
        [K("Ml_agua","Water_ml"), String(total)],
        [K("Gramos_cafe","Coffee_g"), String(coffeeG)],
        ["Ratio", `1:${Math.floor((1000 / recipe.ratioGPerL) * 10 + 1e-9) / 10}`],
        [K("Tiempo_total","Total_time"), fmtTime(totalElapsed)],
      ];
    }

    // Cold Brew (registro)
    const isCb = sc.indexOf("cold") >= 0 || sc.indexOf("cb") >= 0;
    const isCup = sc.indexOf("cup") >= 0 || sc.indexOf("cata") >= 0 || sc.indexOf("tast") >= 0;
    if (cbDone && (isCb || (!isCup && !cupDone))) {
      const water = Math.round(cbCoffeeG * cbRatio);
      return [
        ...dt(now),
        [K("Metodo","Method"), "Cold Brew"],
        [K("Cafe","Coffee"), cbCoffeeName],
        ...grindMeta(K, cbGrind),
        [K("Ml_agua","Water_ml"), String(water)],
        [K("Gramos_cafe","Coffee_g"), String(cbCoffeeG)],
        ["Ratio", `1:${cbRatio}`],
        [K("Reposo","Steep_time"), formatSteepDuration(cbStart, cbEnd, lang)],
        [K("Inicio","Start"), formatDatetimeDisplay(cbStart, lang)],
        [K("Fin","End"), formatDatetimeDisplay(cbEnd, lang)],
        [K("Adiciones","Additions"), cbAdditions],
      ];
    }

    // Ficha de cata (no lleva receta)
    if (cupDone && (isCup || !cbDone)) {
      const c = parseFloat(cupCoffeeG), w = parseFloat(cupWaterG);
      return [
        ...dt(now),
        [K("Metodo","Method"), cupMethod],
        [K("Cafe","Coffee"), cupCoffee],
        [K("Variedad","Variety"), cupVariety],
        [K("Proceso","Process"), cupProcess],
        ...grindMeta(K, cupGrind),
        ["Ratio", ratioOf(c, w)],
        [K("Puntuacion","Score"), cupScore.toFixed(1)],
        [K("Comentarios","Comments"), cupComments],
      ];
    }
    return null;
  }

  window.__gramitoMeta = computePngMeta();

  function handleDownloadOrder(o) {
    if (!ordRef.current || !window.html2canvas) return;
    setOrdCapturing(true);
    window.html2canvas(ordRef.current.parentElement, { scale:2, backgroundColor:null, useCORS:true })
      .then(canvas => {
        setOrdCapturing(false);
        canvas.toBlob(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = `comanda_${String(o.num).padStart(3, "0")}.png`;
          a.click();
          URL.revokeObjectURL(url);
        }, "image/png");
      })
      .catch(() => setOrdCapturing(false));
  }

  // ---- Persistencia: guarda el estado para no perderlo al cambiar de app o recargar ----
  const STORAGE_KEY = "pourlab-state-v1";
  const [hydrated, setHydrated] = useState(false);
  const hydratedRef = useRef(false);
  const snapshotRef = useRef(null);
  const lastSavedRef = useRef("");

  snapshotRef.current = {
    v: 1, savedAt: Date.now(),
    lang, openCat, screen, recipeId,
    customRecipe: customRecipeObj ? {
      name: customRecipeObj.name, shortName: customRecipeObj.shortName, color: customRecipeObj.color,
      ratioGPerL: customRecipeObj.ratioGPerL, defaultCoffee: customRecipeObj.defaultCoffee,
      finalPhases: customRecipeObj.phases(),
    } : null,
    inputVal, inputMode, coffeeG, coffeeName, grind,
    running, elapsed, started, isDone, runPhases, totalElapsed, phaseTimestamps,
    customBrewer, customWaterG, customMode, customPhaseDrafts, selectedTemplate,
    calcRatio, calcCoffee, calcWater,
    cupCoffee, cupVariety, cupProcess, cupMethod, cupGrind, cupCoffeeG, cupWaterG, cupScore, cupComments, cupDone,
    cbCoffeeG, cbRatio, cbCoffeeName, cbGrind, cbAdditions, cbStart, cbEnd, cbDone,
    mkName, mkGrind, mkCoffeeG, mkWaterML, mkStarted, mkDone, mkElapsed, mkFinishedAt, mkStart: mkStartRef.current,
  };

  function persistNow() {
    if (!hydratedRef.current || !snapshotRef.current) return;
    try {
      const str = JSON.stringify(snapshotRef.current);
      if (str !== lastSavedRef.current) {
        localStorage.setItem(STORAGE_KEY, str);
        lastSavedRef.current = str;
      }
    } catch (e) {}
  }

  useEffect(() => {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const d = JSON.parse(raw);
        const dt = d && d.savedAt ? Math.max(0, (Date.now() - d.savedAt) / 1000) : 0;
        if (d && d.v === 1 && dt < 12 * 3600) {
          const rid = d.recipeId || "ultimate";
          let scr = d.screen || "menu";
          if (scr === "app" && ((rid === "custom" && !d.customRecipe) || (rid !== "custom" && !RECIPES[rid]))) scr = "menu";

          setLang(d.lang || "es");
          setOpenCat(d.openCat ?? null);
          setRecipeId(rid);
          if (d.customRecipe) {
            const cr = d.customRecipe;
            const fp = cr.finalPhases;
            setCustomRecipeObj({ id:"custom", name:cr.name, shortName:cr.shortName, color:cr.color, ratioGPerL:cr.ratioGPerL, defaultCoffee:cr.defaultCoffee, phases: () => fp });
          }
          setInputVal(d.inputVal ?? "");
          setInputMode(d.inputMode || "coffee");
          setCoffeeG(d.coffeeG ?? 30);
          setCoffeeName(d.coffeeName || "");
          setGrind(d.grind || "");

          const active = !!d.started && !d.isDone;
          const totalR = (d.totalElapsed || 0) + (active ? dt : 0);
          const phaseR = (d.elapsed || 0) + (active && d.running ? dt : 0);
          offsetRef.current = phaseR; startRef.current = null;
          totalOffsetRef.current = totalR; totalStartRef.current = null;
          setElapsed(phaseR);
          setTotalElapsed(totalR);
          setRunning(!!d.running && active);
          setStarted(!!d.started);
          setIsDone(!!d.isDone);
          setRunPhases(d.runPhases || []);
          setPhaseTimestamps(d.phaseTimestamps || {});

          setCustomBrewer(d.customBrewer || "");
          setCustomWaterG(d.customWaterG ?? 500);
          setCustomMode(d.customMode || "phases");
          if (d.customPhaseDrafts && d.customPhaseDrafts.length) setCustomPhaseDrafts(d.customPhaseDrafts);
          setSelectedTemplate(d.selectedTemplate || "");

          setCalcRatio(d.calcRatio ?? 15);
          setCalcCoffee(d.calcCoffee ?? "20");
          setCalcWater(d.calcWater ?? "300");

          setCupCoffee(d.cupCoffee || "");
          setCupVariety(d.cupVariety || "");
          setCupProcess(d.cupProcess || "");
          setCupMethod(d.cupMethod || "");
          setCupGrind(d.cupGrind || "");
          setCupCoffeeG(d.cupCoffeeG ?? "15");
          setCupWaterG(d.cupWaterG ?? "250");
          setCupScore(d.cupScore ?? 7);
          setCupComments(d.cupComments || "");
          setCupDone(!!d.cupDone);

          setCbCoffeeG(d.cbCoffeeG ?? 30);
          setCbRatio(d.cbRatio ?? 10);
          setCbCoffeeName(d.cbCoffeeName || "");
          setCbGrind(d.cbGrind || "");
          setCbAdditions(d.cbAdditions || "");
          setCbStart(d.cbStart || "");
          setCbEnd(d.cbEnd || "");
          setCbDone(!!d.cbDone);

          setMkName(d.mkName || "");
          setMkGrind(d.mkGrind || "");
          setMkCoffeeG(d.mkCoffeeG || "");
          setMkWaterML(d.mkWaterML || "");
          const mkActive = !!d.mkStarted && !d.mkDone && d.mkStart;
          mkStartRef.current = d.mkStart || 0;
          setMkStarted(!!d.mkStarted);
          setMkDone(!!d.mkDone);
          setMkFinishedAt(d.mkFinishedAt || null);
          setMkElapsed(mkActive ? (Date.now() - d.mkStart) / 1000 : (d.mkElapsed || 0));

          setScreen(scr);
        }
      }
    } catch (e) {}
    setHydrated(true);
  }, []);

  useEffect(() => { hydratedRef.current = hydrated; }, [hydrated]);

  useEffect(() => {
    const id = setInterval(persistNow, 1000);
    const onHide = () => { if (document.visibilityState === "hidden") persistNow(); };

  function startCustomRecipe() {
    const water = parseFloat(customWaterG) || 500;
    const coffee = parseFloat(coffeeG) || 30;

    if (customMode === "phases") {
      const totalAssigned = customPhaseDrafts.reduce((acc,d) => acc + (parseFloat(d.water)||0), 0);
      if (totalAssigned !== water) return;
    }

    let finalPhases;

    if (customMode === "free") {
      finalPhases = [
        { id:"free", start:0, end:9999, label: t("Extracción libre","Free extraction"), targetWater:Math.round(water), note: t("Sin fases definidas · sigue tu propio ritmo","No phases defined · follow your own pace") },
      ];
    } else {
      let start = 0;
      let cumulative = 0;
      finalPhases = customPhaseDrafts.map((d,i) => {
        const dur = Math.max(1, parseInt(d.duration,10) || 30);
        const w   = Math.max(0, parseInt(d.water,10) || 0);
        cumulative += w;
        const ph  = { id:`c${i}`, start, end:start+dur, label:d.label || `Fase ${i+1}`, targetWater:cumulative, note:"" };
        start += dur;
        return ph;
      });
      finalPhases.push({ id:"drawdown", start, end:9999, label: t("Drenado","Drawdown"), targetWater:Math.round(water), note: t("Presiona Finalizar cuando termine de drenar","Press Finish once it's done draining") });
    }

    const ratioGPerL  = coffee > 0 ? (coffee * 1000) / water : 60;

    const currentPhase = getPhase(runPhases, elapsed);
    setPhaseTimestamps(prev => {
      if (prev[currentPhase.id] !== undefined) return prev;
      return { ...prev, [currentPhase.id]: totalElapsed };

  const handleStartPause = useCallback(() => {
    if (running) {
      offsetRef.current = elapsed;
      startRef.current  = null;
      setRunning(false);

      if (!started) setStarted(true);
      startRef.current = null;
      setRunning(true);
    }
  }, [running, elapsed, started]);

  const handleFinish = useCallback(() => {
    cancelAnimationFrame(rafRef.current);
    setRunning(false);
    setIsDone(true);
  }, []);

  const handleNextPhase = useCallback(() => {
    setRunPhases(prev => {
      const cur = getPhase(prev, elapsed);
      const idx = prev.indexOf(cur);
      const next = prev[idx + 1];
      if (!next) return prev;
      const delta = elapsed - next.start;
      return prev.map((p, i) => {
        if (i === idx) return { ...p, end: elapsed };
        if (i > idx) return { ...p, start: p.start + delta, end: p.end < 9999 ? p.end + delta : p.end };
        return p;
      });
    });
  }, [elapsed]);

                style={{"--thumb-color":CUSTOM_COLOR}}
              />
              <div style={s.ratioSliderLabels}><span>1:2</span><span>1:20</span></div>

            <div style={{...s.modeRow, marginTop:16}}>

                    </div>

                <button style={{...s.addPhaseBtn, color:CUSTOM_COLOR, borderColor:CUSTOM_COLOR}} onClick={addPhaseDraft}>{t("+ Añadir fase","+ Add phase")}</button>

                  <div style={s.phaseUnderNote}>{t(`Te faltan ${customWaterG - totalAssigned} g para llegar a la meta de ${customWaterG} g`, `You need ${customWaterG - totalAssigned} more g to reach the goal of ${customWaterG} g`)}</div>

  if (screen === "ratio-calc") {

  if (screen === "cupping") {

  if (screen === "coldbrew") {

              <div style={{marginTop:14}}>
                <div style={s.smallLabel}>{t("Inicio","Start")}</div>

          {cbDone && (

              <div style={s.summaryHero}>
                {cbCoffeeName && <div style={s.summaryName}>{cbCoffeeName}</div>}
                {cbGrind && <div style={s.summaryGrind}>{cbGrind}</div>}
                {cbAdditions && <div style={s.summaryGrind}>{cbAdditions}</div>}
              </div>

              <div style={s.metricsGrid}>
                <div style={s.metricBox}>
                  <div style={{...s.metricValue, color:COLDBREW_COLOR}}>{cbCoffeeG} g</div>
                  <div style={s.metricLabel}>{t("Café","Coffee")}</div>
                </div>
                <div style={s.metricBox}>
                  <div style={{...s.metricValue, color:COLDBREW_COLOR}}>{cbWater} ml</div>
                  <div style={s.metricLabel}>{t("Agua","Water")}</div>
                </div>
                <div style={s.metricBox}>
                  <div style={{...s.metricValue, color:COLDBREW_COLOR}}>1:{cbRatio}</div>
                  <div style={s.metricLabel}>Ratio</div>
                </div>
                <div style={s.metricBox}>
                  <div style={{...s.metricValue, color:COLDBREW_COLOR}}>{cbDuration}</div>
                  <div style={s.metricLabel}>{t("Reposo","Steep")}</div>

              <div style={s.divider} />

              <div style={s.cupFieldRow}><span style={s.cupFieldLabel}>{t("Inicio","Start")}</span><span style={s.cupFieldValue}>{formatDatetimeDisplay(cbStart, lang)}</span></div>
              <div style={s.cupFieldRow}><span style={s.cupFieldLabel}>{t("Fin","End")}</span><span style={s.cupFieldValue}>{formatDatetimeDisplay(cbEnd, lang)}</span></div>
            </div>
          )}

          {cbDone && (
            <button style={{...s.startBtn, width:"100%", marginTop:14, background:COLDBREW_COLOR, boxShadow:`0 8px 20px ${hexToRgba(COLDBREW_COLOR,0.35)}`, opacity:cbCapturing?0.6:1}} onClick={handleDownloadColdBrew}>
              {cbCapturing ? t("Generando imagen…","Generating image…") : t("Descargar registro","Download record")}
            </button>
          )}
        </div>

        {cbDone && (
          <div style={s.hiddenCapture}>
            <div ref={cbRef} style={s.captureCard}>
              <div style={{...s.eyebrow, color:COLDBREW_COLOR, marginBottom:10}}>Cold Brew</div>
              <div style={{...s.summaryTitle, display:"flex", alignItems:"center", justifyContent:"center", flexWrap:"wrap", gap:4, marginBottom:12}}><BrewerIcon id="coldbrew" color="#3d2b1f" size={28} px={1.7} /><TabIcon id="recipes" color="#3d2b1f" size={34} px={1.7} /><span style={{flexBasis:"100%", textAlign:"center", marginTop:2}}>{t("Registro completado","Record complete")}</span></div>
              {cbCoffeeName && <div style={{...s.summaryName, textAlign:"center"}}>{cbCoffeeName}</div>}

                  <div style={s.metricLabel}>{t("Café","Coffee")}</div>
                </div>
                <div style={s.metricBox}>
                  <div style={{...s.metricValue, color:COLDBREW_COLOR}}>{cbWater} ml</div>
                  <div style={s.metricLabel}>{t("Agua","Water")}</div>

                <div style={s.metricBox}>
                  <div style={{...s.metricValue, color:COLDBREW_COLOR}}>1:{cbRatio}</div>
                  <div style={s.metricLabel}>Ratio</div>

              <div style={s.cupFieldRow}><span style={s.cupFieldLabel}>{t("Fin","End")}</span><span style={s.cupFieldValue}>{formatDatetimeDisplay(cbEnd, lang)}</span></div>

  if (screen === "moka") {
    const mkC = parseFloat(mkCoffeeG);

      ...(mkC > 0 ? [{ label:t("Café","Coffee"), value:`${mkCoffeeG} g` }] : []),
      ...(mkW > 0 ? [{ label:t("Agua","Water"), value:`${mkWaterML} ml` }] : []),
      ...(mkRatio ? [{ label:"Ratio", value:mkRatio }] : []),
      { label:t("Tiempo","Time"), value:fmtTime(mkElapsed) },
    ];
    const mkDate = new Date(mkFinishedAt || Date.now());
    const mkDateStr = mkDate.toLocaleDateString(lang === "es" ? "es-CO" : "en-US", {day:"2-digit",month:"long",year:"numeric"});
    const mkTimeStr = mkDate.toLocaleTimeString(lang === "es" ? "es-CO" : "en-US", {hour:"2-digit",minute:"2-digit",hour12:false});
    const mkSummaryBody = (
      <>
        <div style={{...s.summaryTitle, display:"flex", alignItems:"center", justifyContent:"center", flexWrap:"wrap", gap:4}}><BrewerIcon id="moka" color="#3d2b1f" size={28} px={1.7} /><TabIcon id="recipes" color="#3d2b1f" size={34} px={1.7} /><span style={{flexBasis:"100%", textAlign:"center", marginTop:2}}>{t("Extracción completada","Extraction complete")}</span></div>
        <div style={s.summaryDate}>{mkDateStr} · {mkTimeStr}</div>
        {(mkName || mkGrind) && (
          <div style={s.summaryHero}>
            {mkName && <div style={s.summaryName}>{mkName}</div>}
            {mkGrind && <div style={s.summaryGrind}>{mkGrind}</div>}
          </div>
        )}
        <div style={s.metricsGrid}>
          {mkMetrics.map(m => (
            <div key={m.label} style={s.metricBox}>
              <div style={{...s.metricValue, color:MOKA_COLOR}}>{m.value}</div>
              <div style={s.metricLabel}>{m.label}</div>
            </div>
          ))}
        </div>
      </>
    );
    const guide = MOKA_GUIDE[lang];

    return (
      <div style={s.page}>
        <div style={s.card}>
          <div style={s.topBar}>
            <button style={{...s.backBtn, color:MOKA_COLOR}} onClick={()=>{ resetMoka(); setScreen("menu"); }}>{t("‹ Recetas","‹ Recipes")}</button>
            <LangToggle />
          </div>
          <div style={{...s.eyebrow, color:MOKA_COLOR}}>{t("Hoffmann · Cafetera italiana","Hoffmann · Moka Pot")}</div>

          {!mkStarted && !mkDone && (
            <div style={s.setup}>
              <a href={RECIPE_VIDEOS.moka} target="_blank" rel="noopener noreferrer" style={{...s.videoLink, background:MOKA_COLOR}}>
                <PlayIcon color="#fffdfa" size={14} />
                <span>{t("Ver receta en video","Watch recipe video")}</span>
              </a>
              <input type="text" placeholder={t("Nombre del café (ej. Huila Natural)","Coffee name (e.g. Huila Natural)")} value={mkName} onChange={e=>setMkName(e.target.value)} style={{...s.input, fontSize:14}} />
              <input type="text" placeholder={t("Molienda (ej. K6 · click 40)","Grind (e.g. K6 · click 40)")} value={mkGrind} onChange={e=>setMkGrind(e.target.value)} style={{...s.input, fontSize:14, marginTop:8}} />
              <div style={{...s.customGrid, marginTop:8}}>
                <div>
                  <div style={s.smallLabel}>{t("Café (g)","Coffee (g)")}</div>
                  <input type="number" value={mkCoffeeG} onChange={e=>setMkCoffeeG(e.target.value)} style={s.inputSmall} min="0" />
                </div>
                <div>
                  <div style={s.smallLabel}>{t("Agua (ml)","Water (ml)")}</div>
                  <input type="number" value={mkWaterML} onChange={e=>setMkWaterML(e.target.value)} style={s.inputSmall} min="0" />
                </div>
              </div>
              {mkRatio && <div style={s.inputHint}>ratio {mkRatio}</div>}

              <div style={{marginTop:20}}>
                {guide.map(sec => (
                  <div key={sec.title} style={{marginBottom:16}}>
                    <div style={{...s.fasesTitle, color:MOKA_COLOR, borderBottom:"1px solid #ecdfc9", paddingBottom:6}}>{sec.title}</div>
                    {sec.items.map((it, i) => (
                      <div key={i} style={s.mokaItem}>
                        <span style={{...s.mokaMark, color:MOKA_COLOR}}>{sec.ordered ? `${i+1}.` : "•"}</span>
                        <span>{it}</span>
                      </div>
                    ))}
                  </div>
                ))}
              </div>

              <button style={{...s.startBtn, width:"100%", marginTop:6, background:MOKA_COLOR, boxShadow:`0 8px 20px ${hexToRgba(MOKA_COLOR,0.35)}`}} onClick={startMoka}>
                {t("Iniciar","Start")}
              </button>
            </div>
          )}

          {mkStarted && !mkDone && (
            <div style={s.setup}>
              {(mkName || mkGrind) && (
                <div style={s.subEyebrow}>{[mkName, mkGrind].filter(Boolean).join(" · ")}</div>
              )}
              <div style={{textAlign:"center", padding:"20px 0 6px"}}>
                <div style={{fontSize:76, fontWeight:700, color:MOKA_COLOR, lineHeight:1, fontVariantNumeric:"tabular-nums"}}>{fmtTime(mkElapsed)}</div>
                <div style={s.timerCaption}>{t("tiempo transcurrido","elapsed time")}</div>
              </div>
              <div style={{...s.summaryHero, textAlign:"left", marginTop:18}}>
                <div style={s.mokaItem}><span style={{...s.mokaMark, color:MOKA_COLOR}}>•</span><span>{t("Cuando empiece a salir café, baja el fuego","When coffee starts to come out, lower the heat")}</span></div>
                <div style={s.mokaItem}><span style={{...s.mokaMark, color:MOKA_COLOR}}>•</span><span>{t("Si burbujea y salpica, retírala del fuego y pásala bajo agua fría","If it sputters and bubbles, take it off the heat and run it under cold water")}</span></div>
                <div style={s.mokaItem}><span style={{...s.mokaMark, color:MOKA_COLOR}}>•</span><span>{t("Cuando ya no salga más café, retírala del fuego y pulsa Finalizar","When no more coffee comes out, take it off the heat and press Finish")}</span></div>
              </div>
              <div style={s.controls}>
                <button style={s.resetBtn} onClick={resetMoka}>{t("Reiniciar","Reset")}</button>
                <button style={{...s.startBtn, background:MOKA_COLOR, boxShadow:`0 8px 20px ${hexToRgba(MOKA_COLOR,0.35)}`}} onClick={finishMoka}>{t("Finalizar","Finish")}</button>
              </div>
            </div>
          )}

          {mkDone && (
            <div style={s.summary}>
              {mkSummaryBody}
              <button style={{...s.startBtn, width:"100%", marginTop:14, background:MOKA_COLOR, boxShadow:`0 8px 20px ${hexToRgba(MOKA_COLOR,0.35)}`, opacity:mkCapturing?0.6:1}} onClick={handleDownloadMoka}>
                {mkCapturing ? t("Generando imagen…","Generating image…") : t("Descargar resumen","Download summary")}
              </button>
            </div>
          )}
        </div>

        {mkDone && (
          <div style={s.hiddenCapture}>
            <div ref={mkRef} style={s.captureCard}>
              <div style={{...s.eyebrow, color:MOKA_COLOR, marginBottom:12}}>{t("Hoffmann · Cafetera italiana","Hoffmann · Moka Pot")}</div>
              {mkSummaryBody}
            </div>
          </div>
        )}
      </div>
    );
  }

  if (!recipe) return null;

  const phase        = getPhase(runPhases, elapsed);
  const phaseIdx     = runPhases.indexOf(phase);
  const phaseElapsed = Math.max(0, elapsed - (phase.start || 0));
  const phaseDur     = (phase.end < 9999 ? phase.end : phase.start + 85) - phase.start;
  const phaseRem     = Math.max(0, phaseDur - phaseElapsed);
  const phaseProgress= Math.min(1, phaseElapsed / phaseDur);
  const isPour       = phase.id === "bloom" || phase.id.startsWith("pour");
  const isDrawdown   = phase.id === "drawdown" || phase.id === "free";

  const now = new Date();
  const dateStr = now.toLocaleDateString(lang === "es" ? "es-CO" : "en-US", {day:"2-digit",month:"long",year:"numeric"});
  const timeStr = now.toLocaleTimeString(lang === "es" ? "es-CO" : "en-US", {hour:"2-digit",minute:"2-digit",hour12:false});

  const summaryPhases = [
    ...runPhases.filter(p => p.id !== "drawdown" && p.id !== "free").map(p => ({
      t: fmtTime(phaseTimestamps[p.id] !== undefined ? phaseTimestamps[p.id] : p.start),
      label: p.label,
      detalle: `${p.targetWater} g`,
    })),
    { t:"fin", label: t("Drenado completo","Brew complete"), detalle: fmtTime(totalElapsed) },
  ];

  const recipeName = t(recipe.name.es, recipe.name.en);
  const recipeShortName = t(recipe.shortName.es, recipe.shortName.en);

  return (
    <div style={s.page}>
      <div style={s.card}>
        <div style={s.topBar}>
          <button style={{...s.backBtn, color:recipe.color}} onClick={backToMenu}>{t("‹ Recetas","‹ Recipes")}</button>
          <LangToggle />
        </div>
        {!isDone && <div style={{...s.eyebrow, color:recipe.color}}>{recipeName}</div>}

        {!started && recipeId !== "custom" && (
          <div style={s.setup}>
            {RECIPE_VIDEOS[recipeId] && (
              <a href={RECIPE_VIDEOS[recipeId]} target="_blank" rel="noopener noreferrer" style={{...s.videoLink, background:recipe.color}}>
                <PlayIcon color="#fffdfa" size={14} />
                <span>{t("Ver receta en video","Watch recipe video")}</span>
              </a>
            )}
            <div style={s.modeRow}>
              <button style={{...s.modeBtn,...(inputMode==="coffee"?{background:recipe.color,color:"#fffdfa",border:`1px solid ${recipe.color}`}:{})}} onClick={()=>toggleMode("coffee")}>{t("Café (g)","Coffee (g)")}</button>
              <button style={{...s.modeBtn,...(inputMode==="water"?{background:recipe.color,color:"#fffdfa",border:`1px solid ${recipe.color}`}:{})}} onClick={()=>toggleMode("water")}>{t("Agua (ml)","Water (ml)")}</button>
            </div>
            <input type="number" value={inputVal} onChange={e=>handleInput(e.target.value)} style={s.input} min="1" />
            <div style={s.inputHint}>→ {coffeeG} g {t("café","coffee")} · {totalWater} ml {t("agua","water")} · ratio {ratioLabel}</div>
            <input type="text" placeholder={t("Nombre del café (ej. Huila Natural)","Coffee name (e.g. Huila Natural)")} value={coffeeName} onChange={e=>setCoffeeName(e.target.value)} style={{...s.input, fontSize:14, marginTop:10}} />
            <input type="text" placeholder={t("Molienda (ej. K6 · click 40)","Grind (e.g. K6 · click 40)")} value={grind} onChange={e=>setGrind(e.target.value)} style={{...s.input, fontSize:14, marginTop:8}} />
            {recipe.prep && (
              <div style={{marginTop:18}}>
                <div style={{...s.fasesTitle, color:recipe.color, borderBottom:"1px solid #ecdfc9", paddingBottom:6}}>{t("PREPARACIÓN","PREPARATION")}</div>
                {recipe.prep[lang === "en" ? "en" : "es"].map((it, i) => (
                  <div key={i} style={s.mokaItem}>
                    <span style={{...s.mokaMark, color:recipe.color}}>{i+1}.</span>
                    <span>{it}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {!started && recipeId === "custom" && (
          <div style={s.setup}>
            <div style={s.summaryHero}>
              {customBrewer && <div style={s.summaryGrind}>{customBrewer}</div>}
              {coffeeName && <div style={s.summaryName}>{coffeeName}</div>}
              {grind && <div style={s.summaryGrind}>{grind}</div>}
            </div>
            <div style={s.inputHint}>{coffeeG} g {t("café","coffee")} · {totalWater} ml {t("agua","water")} · ratio {ratioLabel}</div>
          </div>
        )}

        {started && !isDone && (
          <div style={s.subEyebrow}>
            {recipeId==="custom" && customBrewer && <strong>{customBrewer} · </strong>}
            {coffeeName && <strong>{coffeeName} · </strong>}
            {coffeeG} g · {totalWater} ml · {ratioLabel}{grind ? ` · ${grind}` : ""}
          </div>
        )}

        {!isDone && (
          <>
            <div style={s.waterBlock}>
              <div style={s.waterNumber}>{phase.targetWater}<span style={{...s.waterUnit, color:recipe.color}}>g</span></div>
              <div style={s.waterCaption}>{isPour ? t("llega hasta aquí","pour up to here") : t("agua en la jarra","water in the carafe")}</div>
            </div>

            <div style={s.timerBlock}>
              <div style={{...s.timerNumber, color:recipe.color}}>{isDrawdown ? fmtTime(totalElapsed) : phase.manual ? fmtTime(phaseElapsed) : fmtTime(phaseRem)}</div>
              <div style={s.timerCaption}>{isDrawdown ? t("tiempo total · presiona finalizar cuando termines","total time · press finish when you're done") : phase.manual ? t("tiempo en esta fase · pulsa Siguiente cuando termines","time in this phase · tap Next when you're done") : t("tiempo restante de esta fase","time left in this phase")}</div>
            </div>

            <div style={s.phaseRow}>
              <div style={s.phaseLabel}>{phase.label}</div>
              <div style={s.phaseTime}>t {fmtTime(totalElapsed)}</div>
            </div>
            <div style={s.note}>{phase.note}</div>

            <div style={s.progressTrack}>
              <div style={{...s.progressFill, width:`${phaseProgress*100}%`, background:recipe.color}} />
            </div>
            <div style={s.timeline}>
              {runPhases.map((p,i)=>(
                <div key={p.id} style={{...s.timelineSeg,
                  flexGrow: (p.id==="drawdown"||p.id==="free") ? 85 : p.end-p.start,
                  background: i<phaseIdx?recipe.color:i===phaseIdx?hexToRgba(recipe.color,0.5):"#e8ddd0"}} />
              ))}
            </div>
          </>
        )}

        {isDone && (
          <div style={s.summary}>
            <div style={{...s.eyebrow, color:recipe.color, marginBottom:16}}>{recipeName}</div>
            <div style={{...s.summaryTitle, display:"flex", alignItems:"center", justifyContent:"center", flexWrap:"wrap", gap:4}}>{METHOD_ICON[recipeId] && <BrewerIcon id={METHOD_ICON[recipeId]} color="#3d2b1f" size={28} px={1.7} />}<TabIcon id="recipes" color="#3d2b1f" size={34} px={1.7} /><span style={{flexBasis:"100%", textAlign:"center", marginTop:2}}>{t("Extracción completada","Extraction complete")}</span></div>
            <div style={s.summaryDate}>{dateStr} · {timeStr}</div>

            {(coffeeName || grind || (recipeId==="custom" && customBrewer)) && (
              <div style={s.summaryHero}>
                {recipeId==="custom" && customBrewer && <div style={s.summaryGrind}>{customBrewer}</div>}
                {coffeeName && <div style={s.summaryName}>{coffeeName}</div>}
                {grind && <div style={s.summaryGrind}>{grind}</div>}
              </div>
            )}

            <div style={s.metricsGrid}>
              {[
                { label:t("Café","Coffee"),   value:`${coffeeG} g` },
                { label:t("Agua","Water"),   value:`${totalWater} ml` },
                { label:t("Tiempo","Time"), value:fmtTime(totalElapsed) },
                { label:"Ratio",  value:ratioLabel },
              ].map(m => (
                <div key={m.label} style={s.metricBox}>
                  <div style={{...s.metricValue, color:recipe.color}}>{m.value}</div>
                  <div style={s.metricLabel}>{m.label}</div>
                </div>
              ))}
            </div>

            <div style={s.divider} />

            <div style={{...s.fasesTitle, color:recipe.color}}>{t("FASES","PHASES")} · {recipeShortName}</div>
            {summaryPhases.map((f,i) => (
              <div key={`${f.t}-${i}`} style={s.faseRow}>
                <span style={{...s.faseT, color:recipe.color}}>{f.t}</span>
                <span style={s.faseLabel}>{f.label}</span>
                <span style={s.faseDetalle}>{f.detalle}</span>
              </div>
            ))}
          </div>
        )}

        {isDone && (
          <div style={s.hiddenCapture}>
            <div ref={summaryRef} style={s.captureCard}>
              <div style={{...s.eyebrow, color:recipe.color, marginBottom:16}}>{recipeName}</div>
              <div style={{...s.summaryTitle, display:"flex", alignItems:"center", justifyContent:"center", flexWrap:"wrap", gap:4}}>{METHOD_ICON[recipeId] && <BrewerIcon id={METHOD_ICON[recipeId]} color="#3d2b1f" size={28} px={1.7} />}<TabIcon id="recipes" color="#3d2b1f" size={34} px={1.7} /><span style={{flexBasis:"100%", textAlign:"center", marginTop:2}}>{t("Extracción completada","Extraction complete")}</span></div>
              <div style={s.summaryDate}>{dateStr} · {timeStr}</div>

              {(coffeeName || grind || (recipeId==="custom" && customBrewer)) && (
                <div style={s.summaryHero}>
                  {recipeId==="custom" && customBrewer && <div style={s.summaryGrind}>{customBrewer}</div>}
                  {coffeeName && <div style={s.summaryName}>{coffeeName}</div>}
                  {grind && <div style={s.summaryGrind}>{grind}</div>}
                </div>
              )}

              <div style={s.metricsGrid}>
                {[
                  { label:t("Café","Coffee"),   value:`${coffeeG} g` },
                  { label:t("Agua","Water"),   value:`${totalWater} ml` },
                  { label:t("Tiempo","Time"), value:fmtTime(totalElapsed) },
                  { label:"Ratio",  value:ratioLabel },
                ].map(m => (
                  <div key={m.label} style={s.metricBox}>
                    <div style={{...s.metricValue, color:recipe.color}}>{m.value}</div>
                    <div style={s.metricLabel}>{m.label}</div>
                  </div>
                ))}
              </div>

              <div style={s.divider} />

              <div style={{...s.fasesTitle, color:recipe.color}}>{t("FASES","PHASES")} · {recipeShortName}</div>
              {summaryPhases.map((f,i) => (
                <div key={`h-${f.t}-${i}`} style={s.faseRow}>
                  <span style={{...s.faseT, color:recipe.color}}>{f.t}</span>
                  <span style={s.faseLabel}>{f.label}</span>
                  <span style={s.faseDetalle}>{f.detalle}</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {isDone && (
          <button style={{...s.startBtn, width:"100%", marginTop:14, background:recipe.color, boxShadow:`0 8px 20px ${hexToRgba(recipe.color,0.35)}`, opacity: capturing ? 0.6 : 1}} onClick={handleDownload}>
            {capturing ? t("Generando imagen…","Generating image…") : t("Descargar resumen","Download summary")}
          </button>
        )}

        <div style={s.controls}>
          {!isDone && (
            <button style={s.resetBtn} onClick={handleReset}>
              {t("Reiniciar","Reset")}
            </button>
          )}
          {!isDone && !isDrawdown && (
            <>
              <button style={{...s.startBtn, background:recipe.color, boxShadow:`0 8px 20px ${hexToRgba(recipe.color,0.35)}`}} onClick={handleStartPause}>
                {running ? t("Pausar","Pause") : elapsed > 0 ? t("Reanudar","Resume") : t("Empezar","Start")}
              </button>
              {started && (
                <button style={{...s.nextBtn, color:recipe.color, borderColor:recipe.color}} onClick={handleNextPhase}>
                  {t("Siguiente ›","Next ›")}
                </button>
              )}
            </>
          )}
          {!isDone && isDrawdown && (
            <>
              <button style={{...s.startBtn, background:"#8a7660", boxShadow:"none", flex:"0 0 100px"}} onClick={handleStartPause}>
                {running ? t("Pausar","Pause") : elapsed > 0 ? t("Reanudar","Resume") : t("Empezar","Start")}
              </button>
              <button style={{...s.startBtn, background:recipe.color, boxShadow:`0 8px 20px ${hexToRgba(recipe.color,0.35)}`, flex:1}} onClick={handleFinish}>
                {t("Finalizar","Finish")}
              </button>
            </>
          )}
        </div>

        {!isDone && <div style={s.totalTime}>t = {fmtTime(totalElapsed)}</div>}
      </div>
    </div>
  );
}

const s = {
  page:         { minHeight:"100dvh", background:"linear-gradient(180deg,#faf6f0,#f0e6d8)", display:"flex", alignItems:"center", justifyContent:"center", padding:"clamp(8px,3vw,24px)", fontFamily:"'Iowan Old Style','Palatino Linotype',Georgia,serif", boxSizing:"border-box" },
  card:         { width:"100%", maxWidth:420, background:"#fffdfa", borderRadius:24, padding:"clamp(18px,5vw,32px) clamp(14px,4.5vw,28px) 24px", boxShadow:"0 20px 50px rgba(80,50,20,.12),0 2px 8px rgba(80,50,20,.08)", border:"1px solid #ecdfc9" },
  eyebrow:      { fontSize:12, letterSpacing:"0.14em", fontWeight:700, color:"#b5651d", textAlign:"center", fontFamily:"'Helvetica Neue',Arial,sans-serif" },
  subEyebrow:   { fontSize:12, color:"#8a7660", textAlign:"center", marginTop:4, marginBottom:10, fontFamily:"'Helvetica Neue',Arial,sans-serif" },
  setup:        { marginTop:14, marginBottom:4 },
  topBar:       { display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 },
  backBtn:      { border:"none", background:"none", color:"#b5651d", fontWeight:700, fontSize:13, cursor:"pointer", padding:0, fontFamily:"'Helvetica Neue',Arial,sans-serif" },
  langToggle:   { display:"flex", gap:4 },
  langBtn:      { border:"1px solid #ecdfc9", background:"#fff", color:"#8a6a4f", fontWeight:700, fontSize:10.5, cursor:"pointer", padding:"4px 8px", borderRadius:6, fontFamily:"'Helvetica Neue',Arial,sans-serif" },
  langBtnActive:{ background:"#3d2b1f", color:"#fffdfa", border:"1px solid #3d2b1f" },
  menuTitle:    { fontSize:13, letterSpacing:"0.14em", fontWeight:700, color:"#b5651d", textAlign:"center", fontFamily:"'Helvetica Neue',Arial,sans-serif", marginBottom:22 },
  appName:      { fontSize:22, fontWeight:700, color:"#3d2b1f", textAlign:"center", marginBottom:"clamp(10px,2.4vh,26px)", fontFamily:"'Iowan Old Style','Palatino Linotype',Georgia,serif" },
  categoryBlock:{ marginBottom:22 },
  categoryLabel:{ fontSize:11, fontWeight:700, color:"#8a7660", letterSpacing:"0.12em", fontFamily:"'Helvetica Neue',Arial,sans-serif", marginBottom:16, borderBottom:"1px solid #ecdfc9", paddingBottom:6 },
  categoryLabelClickable:{ display:"flex", justifyContent:"space-between", alignItems:"center", cursor:"pointer", userSelect:"none" },
  catArrow:     { fontSize:11, color:"#8a7660" },
  videoLink:    { display:"flex", alignItems:"center", justifyContent:"center", gap:7, width:"fit-content", margin:"0 auto 14px", padding:"7px 14px", borderRadius:10, border:"none", color:"#fffdfa", fontSize:12, fontWeight:400, letterSpacing:"0.02em", textDecoration:"none", fontFamily:"'Helvetica Neue',Arial,sans-serif" },
  brewGrid:     { display:"grid", gridTemplateColumns:"1fr 1fr", gap:"clamp(6px,1.3vh,10px)" },
  brewTile:     { display:"flex", flexDirection:"column", alignItems:"center", gap:6, padding:"clamp(8px,1.8vh,16px) 8px clamp(8px,1.4vh,12px)", borderRadius:18, cursor:"pointer", fontFamily:"'Helvetica Neue',Arial,sans-serif" },
  brewTileName: { fontSize:13, color:"#3d2b1f", fontWeight:500 },
  brewTileSub:  { fontSize:10.5, color:"#8a7660" },
